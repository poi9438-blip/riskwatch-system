# RiskWatch 설정 (비밀값은 환경변수/.env에서 주입)

spring:
  application:
    name: riskwatch-system

  # 로컬 실행 시 저장소 루트의 .env를 설정으로 불러옴 (없으면 무시)
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    # Docker 안에서는 DB_URL로 덮어씀, DB 시간 기준 UTC. 비밀번호는 기본값 없음
    url: ${DB_URL:jdbc:mysql://localhost:3312/riskwatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:rwuser}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 커넥션을 얻을 때까지 최대 10초 대기
    hikari:
      connection-timeout: 10000

  jackson:
    deserialization:
      # 정수 칸(금액·기간·자녀 수)에 소수가 오면 버리지 않고 거부 (1.5 → 1로 판정하지 않게)
      accept-float-as-int: false

  jpa:
    # 요청 끝까지 DB 커넥션을 잡지 않도록 OSIV 끔 (HomeFin #71에서 확인한 문제)
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)가 만들고 바꿈, Hibernate는 엔티티와 테이블이 맞는지 확인만
      ddl-auto: validate
    show-sql: false
  mvc:
    servlet:
      # 요청 처리기(DispatcherServlet)를 첫 요청 때가 아니라 시작할 때 준비 (#2)
      load-on-startup: 1

server:
  # RiskWatch 포트 8120 (HomeFin 8100, RiskWatch 8120)
  port: ${SERVER_PORT:8120}

app:
  operator:
    # 운영자 토큰 서명 키 (RiskWatch만 앎, 32바이트 이상, 기본값 없음)
    jwt-secret: ${OPERATOR_JWT_SECRET}
    # 운영자 토큰 유효 기간 (기본 8시간)
    token-expiration-ms: ${OPERATOR_TOKEN_EXPIRATION_MS:28800000}
    # 첫 운영자 계정 (서버 시작 때 없으면 만듦, 비우면 만들지 않음)
    initial-email: ${OPERATOR_EMAIL:}
    initial-password: ${OPERATOR_PASSWORD:}
  service-token:
    # 평가를 요청하는 서버별 서비스 토큰 서명 키 (각 서버와 RiskWatch만 앎, 32바이트 이상, 서로 다른 값, 기본값 없음)
    homefin-secret: ${HOMEFIN_TOKEN_SECRET}
    finflow-secret: ${FINFLOW_TOKEN_SECRET}
  encryption:
    # 평가 입력의 연소득·DTI 암호화 키 (정확히 32바이트, 기본값 없음)
    key: ${ENCRYPTION_KEY}
  warm-up:
    # 시작할 때 평가 경로를 한 번 미리 실행 (저장은 롤백, 띄운 직후 첫 평가가 느린 문제 #2)
    enabled: ${WARM_UP_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # 웹으로는 health만 공개 (env, beans 등 내부 정보 노출 방지)
        include: health
  endpoint:
    health:
      # 상태 세부 정보 숨김
      show-details: never
      # 준비 상태(readiness)를 health에 포함: 시작 준비가 끝나기 전에는 503 (#2)
      probes:
        enabled: true

logging:
  level:
    com.riskwatch: INFO
  pattern:
    # 로그 형식: 시간 [스레드] [traceId] 레벨 클래스 - 메시지
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"
